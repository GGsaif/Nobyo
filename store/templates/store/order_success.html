{% extends 'store/base.html' %}

{% block title %}Order Success{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="checkout-card p-5 text-center mx-auto" style="max-width: 600px;">
        <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4"
            style="width: 80px; height: 80px;">
            <i class="fas fa-check fa-2x"></i>
        </div>
        <h1 class="fw-bold mb-3">Thank You!</h1>
        <p class="text-muted lead mb-4">Your order <strong>#{{ order.id }}</strong> has been placed successfully.</p>
        <div class="bg-light p-4 rounded-3 mb-4">
            <h5 class="fw-bold mb-0">Total Payable: ৳{{ order.get_total_cost }}</h5>
            <p class="small text-muted mb-0">Payment Method: Cash on Delivery</p>
        </div>
        <a href="{% url 'store:product_list' %}" class="place-order-btn text-decoration-none d-inline-block">Continue
            Shopping</a>
    </div>
</div>
{% endblock %}
